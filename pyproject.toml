[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vigilhub"
version = "0.1.0"
description = "Security command center that ingests VigilSIEM, GitVigil and ReconVigil output and correlates findings into incidents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "bandit[toml]>=1.7.9",
]

[project.scripts]
vigilhub = "vigilhub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts; test fixtures use throwaway literal keys.
"tests/**" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
